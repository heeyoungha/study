services:
  # Spring Boot 애플리케이션
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: study-app:latest 
    container_name: study-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/study?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQLDialect
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CAFE_RECOMMENDATION_BASE_URL=http://localhost:8080/dir/
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - study-network
    volumes:
      - ./logs/app:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MySQL 데이터베이스
  mysql:
    image: mysql:8.0
    container_name: study-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - MYSQL_DATABASE=study
      - MYSQL_USER=${SPRING_DATASOURCE_USERNAME}
      - MYSQL_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/config/my.conf:/etc/mysql/conf.d/my.cnf
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - study-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx 리버스 프록시
  nginx:
    image: nginx:alpine
    container_name: study-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf
      - ./logs/nginx:/var/log/nginx
      - ./src/main/resources/static:/var/www/html
      - ./python-api/static:/var/www/html/static
      - ./django-commerce/staticfiles:/var/www/html/django-staticfiles
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      app:
        condition: service_started
      python-api:
        condition: service_started
      django-commerce:
        condition: service_started
    networks:
      - study-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 기존 Python FastAPI 서비스
  python-api:
    build:
      context: ./python-api
      dockerfile: Dockerfile
    image: python-api:latest
    container_name: python-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATASOURCE_HOST=mysql
      - DATASOURCE_PORT=3306
      - DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - DATASOURCE_DB=study
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - study-network
    volumes:
      - ./logs/python-api:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  django-commerce:
    build:
      context: ./django-commerce
      dockerfile: Dockerfile
    image: django-commerce:latest
    container_name: django-commerce
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-development-key-change-in-production}
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,django-commerce,letsadam.shop
      - DB_NAME=study
      - DB_USER=${SPRING_DATASOURCE_USERNAME:-root}
      - DB_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-password}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - study-network
    volumes:
      - ./logs/django:/app/logs
      - ./django-commerce/media:/app/media
      - ./django-commerce/staticfiles:/app/staticfiles
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Loki 로깅 시스템
  loki:
    image: grafana/loki:2.8.0
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - study-network

  # Fluent Bit 로그 수집기
  fluent-bit:
    image: fluent/fluent-bit:2.1.10
    container_name: fluent-bit
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./logs:/var/log
    depends_on:
      - loki
    networks:
      - study-network
    healthcheck:
      test: ["CMD", "fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf", "-V"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana 모니터링 대시보드
  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - loki
    networks:
      - study-network

networks:
  study-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  loki-data:
  grafana-data:
