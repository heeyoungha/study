services:
  app:
    image: study-app:v1.0.2
    container_name: study-app
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # RDS 퍼블릭 액세스가 비활성화된 경우 내부 엔드포인트 사용
      - SPRING_DATASOURCE_URL=jdbc:mysql://${RDS_ENDPOINT}:3306/${RDS_DATABASE}?useSSL=true&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${RDS_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${RDS_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_JPA_SHOW_SQL=false
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQL8Dialect
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CAFE_RECOMMENDATION_BASE_URL=https://actlog.shop/dir/
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    ports:
      - "8080:8080"
    networks:
      - study-network
    volumes:
      - ./logs/app:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:v1.0.2
    container_name: study-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d/app-prod.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt/live/actlog.shop:/etc/letsencrypt/live/actlog.shop:ro
      - /etc/letsencrypt/archive/actlog.shop:/etc/letsencrypt/archive/actlog.shop:ro
      - ./src/main/resources/static:/var/www/html
      - ./python-api/static:/var/www/html/static #파이썬 정적파일
      - ./django-commerce/staticfiles:/var/www/html/django-staticfiles
    depends_on:
      - app
      - python-api
      - django-commerce
    networks:
      - study-network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "https://actlog.shop" ]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  python-api:
    image: python-api:v1.0.2
    container_name: python-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATASOURCE_HOST=${RDS_ENDPOINT}
      - DATASOURCE_PORT=3306
      - DATASOURCE_USERNAME=${RDS_USERNAME}
      - DATASOURCE_PASSWORD=${RDS_PASSWORD}
      - DATASOURCE_DB=${RDS_DATABASE}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    env_file:
      - .env
    networks:
      - study-network
    volumes:
      - ./logs/python-api:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
      
  django-commerce:
    build:
      context: ./django-commerce
      dockerfile: Dockerfile
    image: django-commerce:v1.0.2
    container_name: django-commerce
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=django-commerce,actlog.shop
      - DB_NAME=${RDS_DATABASE}
      - DB_USER=${RDS_USERNAME}
      - DB_PASSWORD=${RDS_PASSWORD}
      - DB_HOST=${RDS_ENDPOINT}
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
    env_file:
      - .env
    networks:
      - study-network
    volumes:
      - ./logs/django:/app/logs
      - ./django-commerce/media:/app/media
      - ./django-commerce/staticfiles:/app/staticfiles
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # Loki 로깅 시스템
  loki:
    image: grafana/loki:2.8.0
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - study-network

  # Fluent Bit 로그 수집기
  fluent-bit:
    image: fluent/fluent-bit:2.1.10
    container_name: fluent-bit
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./logs:/var/log
    depends_on:
      - loki
    networks:
      - study-network
    healthcheck:
      test: [ "CMD", "fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf", "-V" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana 모니터링 대시보드
  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - loki
    networks:
      - study-network

networks:
  study-network:
    driver: bridge

volumes:
  loki-data:
  grafana-data: