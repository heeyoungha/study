<!DOCTYPE html>
<html>
<head>
    <title>독서모임 - 입력</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/common.css') }}">
</head>
<body>
    <div class="container">
        <h1>독서모임 - 독후감 작성</h1>
        
        <!-- 서비스 상태 표시 -->
        <div id="service-status" class="status-indicator status-warning">
            <div id="status-content">
                <span class="status-icon">⏳</span>
                <span id="status-text">서비스 상태 확인 중...</span>
            </div>
        </div>

        <form method="post" action="/bookclub/form">
            <div class="form-group">
                <label for="book_title">책 제목:</label>
                <input type="text" id="book_title" name="book_title" required>
            </div>
            <div class="form-group">
                <label for="summary">한줄소감:</label>
                <input type="text" id="summary" name="summary" required placeholder="책에 대한 한줄 소감을 입력하세요...">
            </div>
            <div class="form-group">
                <label for="review">소감문 (3-4줄):</label>
                <textarea id="review" name="review" required placeholder="오늘 읽은 책에 대한 소감을 3-4줄로 작성해주세요..."></textarea>
            </div>
            <button type="submit">저장</button>
        </form>

        <div class="nav-links">
            <a href="/diary/list">📋 일기 목록</a>
            <a href="/bookclub/list">📚 독서모임</a>
            <a href="/project">🏄🏻 프로젝트</a>
        </div>
    </div>

    <script>
        // 서비스 상태 확인
        async function checkServiceStatus() {
            try {
                const response = await fetch('/python/health');
                const data = await response.json();
                
                const statusDiv = document.getElementById('service-status');
                const statusText = document.getElementById('status-text');
                
                if (data.services.gpt_api === 'available') {
                    statusDiv.className = 'status-indicator status-good';
                    statusText.innerHTML = '<span class="status-icon">✅</span>GPT AI 서비스가 정상 작동 중입니다. 고급 프로젝트 추천을 제공합니다.';
                } else {
                    statusDiv.className = 'status-indicator status-warning';
                    statusText.innerHTML = '<span class="status-icon">⚠️</span>GPT AI 서비스가 사용 불가능합니다. 기본 추천을 사용합니다.';
                }
            } catch (error) {
                const statusDiv = document.getElementById('service-status');
                const statusText = document.getElementById('status-text');
                statusDiv.className = 'status-indicator status-bad';
                statusText.innerHTML = '<span class="status-icon">❌</span>서비스 상태 확인에 실패했습니다.';
            }
        }
        
        // 페이지 로드 시 상태 확인
        checkServiceStatus();
        
        // 30초마다 상태 재확인
        setInterval(checkServiceStatus, 30000);
    </script>
</body>
</html>
