<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일기 작성</title>
    <link rel="stylesheet" href="/python-static/css/common.css">
</head>
<body>
    <div class="container">
        <h1>📝 일기 작성</h1>
        
        <!-- 서비스 상태 표시 -->
        <div id="service-status" class="status-indicator status-warning">
            <div id="status-content">
                <span class="status-icon">⏳</span>
                <span id="status-text">서비스 상태 확인 중...</span>
            </div>
        </div>
        
        <form action="/diary" method="post">
            <div class="form-group">
                <label for="summary">요약 (한 줄로)</label>
                <input type="text" id="summary" name="summary" required placeholder="오늘 하루를 한 줄로 요약해주세요">
            </div>
            
            <div class="form-group">
                <label for="content">일기 내용</label>
                <textarea id="content" name="content" required placeholder="오늘 있었던 일이나 느낀 점을 자유롭게 작성해주세요. AI가 감정을 분석하고 맞춤형 프로젝트를 추천해드립니다."></textarea>
            </div>
            
            <button type="submit">일기 저장</button>
        </form>
        
        <div class="nav-links">
            <a href="/diary/list">📋 일기 목록</a>
            <a href="/bookclub/list">📚 독서모임</a>
            <a href="/project">🏄🏻 프로젝트</a>
        </div>
    </div>

    <script>
        // 서비스 상태 확인
        async function checkServiceStatus() {
            try {
                const response = await fetch('/python/health');
                const data = await response.json();
                
                const statusDiv = document.getElementById('service-status');
                const statusText = document.getElementById('status-text');
                
                if (data.services.gpt_api === 'available') {
                    statusDiv.className = 'status-indicator status-good';
                    statusText.innerHTML = '<span class="status-icon">✅</span>GPT AI 서비스가 정상 작동 중입니다. 고급 감정 분석을 제공합니다.';
                } else {
                    statusDiv.className = 'status-indicator status-warning';
                    statusText.innerHTML = '<span class="status-icon">⚠️</span>GPT AI 서비스가 사용 불가능합니다. 기본 키워드 분석을 사용합니다.';
                }
            } catch (error) {
                const statusDiv = document.getElementById('service-status');
                const statusText = document.getElementById('status-text');
                statusDiv.className = 'status-indicator status-bad';
                statusText.innerHTML = '<span class="status-icon">❌</span>서비스 상태 확인에 실패했습니다.';
            }
        }
        
        // 페이지 로드 시 상태 확인
        checkServiceStatus();
        
        // 30초마다 상태 재확인
        setInterval(checkServiceStatus, 30000);
    </script>
</body>
</html>
