{% include 'fragment/nav.html' %}
<!DOCTYPE html>
<html>
<head>
    <title>일기 작성</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-container { background: #f8f9fa; padding: 32px; border-radius: 10px; max-width: 500px; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        textarea { height: 100px; resize: vertical; }
        button { background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        h1 { text-align: center; margin-bottom: 30px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>일기 작성</h1>
        <form action="/diary" method="post">
            <div class="form-group">
                <label for="summary">한줄일기(제목):</label>
                <input type="text" id="summary" name="summary" required placeholder="오늘의 한줄일기를 입력하세요..."/>
            </div>
            <div class="form-group">
                <label for="content">오늘의 일기:</label>
                <textarea id="content" name="content" required placeholder="오늘의 일기를 자유롭게 작성해보세요..."></textarea>
            </div>
            <button type="submit">분석하기</button>
        </form>
    </div>
</body>
</html>
