
[SERVICE]
    Flush        1
    Daemon       off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224

[INPUT]
    Name         tail
    Path         /var/log/*.log
    Parser       docker
    Tag          container.*
    Mem_Buf_Limit 5MB
    Skip_Long_Lines On
    DB           /tmp/flb_logs.db
    DB.Sync      Normal

[INPUT]
    Name         tail
    Path         /var/log/*/*.log
    Parser       docker
    Tag          container.*
    Mem_Buf_Limit 5MB
    Skip_Long_Lines On
    DB           /tmp/flb_logs_sub.db
    DB.Sync      Normal

[INPUT]
    Name         dummy
    Tag          dummy.log
    Dummy        {"log":"Test log from fluent-bit","time":"2025-08-03T08:30:00.000000000Z"}

[OUTPUT]
    Name         loki
    Match        *
    Host         loki
    Port         3100
    Labels       job=docker-logs,env=dev
    Compress     gzip
    Remove_Keys  kubernetes,stream,time,tag,container_id,container_name
