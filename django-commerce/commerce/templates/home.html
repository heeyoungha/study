<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Commerce</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: #2c3e50;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        .endpoint {
            background: rgba(52, 152, 219, 0.1);
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #3498db;
        }
        .endpoint h3 {
            margin: 0 0 10px 0;
            color: #2980b9;
        }
        .endpoint p {
            margin: 5px 0;
            font-family: 'Courier New', monospace;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 5px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #2980b9;
        }
        .api-section {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Django Commerce API</h1>
        
        <div class="api-section">
            <h2>📋 사용 가능한 엔드포인트</h2>
            
            <div class="endpoint">
                <h3>📚 API 문서</h3>
                <p><strong>Swagger UI:</strong> {% url 'swagger-ui' %}</p>
                <p><strong>ReDoc:</strong> {% url 'redoc' %}</p>
                <p><strong>설명:</strong> 인터랙티브 API 문서 및 테스트</p>
                <a href="{% url 'swagger-ui' %}" class="btn" style="background: #ff6b35;">Swagger 문서</a>
                <a href="{% url 'redoc' %}" class="btn" style="background: #2ecc71;">ReDoc 문서</a>
            </div>
            
            <div class="endpoint">
                <h3>관리자 페이지</h3>
                <p><strong>URL:</strong> /admin/</p>
                <p><strong>설명:</strong> Django Admin을 통한 상품 관리</p>
                <a href="{% url 'admin:index' %}" class="btn">관리자 페이지</a>
            </div>
        </div>
        
        <div style="margin-top: 30px; text-align: center;">
            <p><strong>서버 상태:</strong> 🟢 실행 중 (포트: 8001)</p>
        </div>
    </div>
</body>
</html>
