# 80 포트: Certbot 인증 및 HTTP -> HTTPS 리디렉션
server {
    listen 80;
    server_name letsadam.shop;

    # Certbot 인증 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 모든 HTTP 요청을 HTTPS로 리디렉션
    location / {
        return 301 https://$host$request_uri;
    }
}

# 443 포트: SSL 적용
server {
    listen 443 ssl;
    server_name letsadam.shop;

    ssl_certificate /etc/letsencrypt/live/letsadam.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/letsadam.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 정적 파일 서빙
    location /static/ {
        alias /var/www/html/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Spring Boot 애플리케이션 프록시
    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # 헬스체크
    location /health {
        proxy_pass http://app:8080/actuator/health;
        proxy_set_header Host $host;
        access_log off;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
} 