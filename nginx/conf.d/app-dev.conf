# 80 포트: Certbot 인증 및 정적 파일 처리
server {
    listen 80;
    server_name letsadam.shop;

    # Certbot 인증 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 정적 파일은 HTTP에서도 직접 처리
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        root /var/www/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 나머지 요청은 HTTPS로 리디렉션
    location / {
        return 301 https://$host$request_uri;
    }
}

# 443 포트: SSL 적용
server {
    listen 443 ssl;
    server_name letsadam.shop;

    ssl_certificate /etc/letsencrypt/live/letsadam.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/letsadam.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Spring Boot 정적 파일 서빙
    location /spring-static/ {
        alias /var/www/html/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # CSS 파일 서빙
    location /css/ {
        alias /var/www/html/css/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Spring Boot 이미지 파일 서빙
    location /img/ {
        alias /var/www/html/img/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 기존 /static/ 경로는 Spring Boot로 리다이렉트 (하위 호환성)
    location /static/ {
        alias /var/www/html/spring-static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # FastAPI: /diary
    location ^~ /diary {
        proxy_pass http://python-api:8000;

        # proxy_params 대신 직접 헤더 지정
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # FastAPI: /bookclub
    location ^~ /bookclub {
        proxy_pass http://python-api:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI: /python
    location ^~ /python {
        proxy_pass http://python-api:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # FastAPI 정적 파일
    location ^~ /python-static/ {
        proxy_pass http://python-api:8000/python-static/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Commerce
    location ^~ /commerce {
        proxy_pass http://django-commerce:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-CSRFToken $http_x_csrftoken;
        proxy_set_header X-Requested-With $http_x_requested_with;
    }

    # Django 정적 파일 (FORCE_SCRIPT_NAME 고려)
    location ^~ /commerce/django-static/ {
        alias /var/www/html/django-staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Spring Boot 메인 애플리케이션
    location / {
        proxy_pass http://app:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # 헬스체크
    location /health {
        proxy_pass http://app:8080/actuator/health;
        access_log off;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
