# HTTP
server {
    listen 80;
    server_name localhost;

    # Spring Boot 정적 파일 서빙
    location /spring-static/ {
        alias /var/www/html/spring-static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Spring Boot 이미지 파일 서빙
    location /img/ {
        alias /var/www/html/spring-static/img/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 기존 /static/ 경로는 Spring Boot로 리다이렉트 (하위 호환성)
    location /static/ {
        alias /var/www/html/spring-static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # FastAPI 프록시: /diary로 시작하는 모든 요청
    location ^~ /diary {
        proxy_pass http://python-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        
        # API 요청에 대한 타임아웃 설정
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # CORS 헤더 추가 (API 요청용)
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
        
        # OPTIONS 요청 처리 (CORS preflight)
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # FastAPI 프록시: /bookclub로 시작하는 모든 요청
    location ^~ /bookclub {
        proxy_pass http://python-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        
        # API 요청에 대한 타임아웃 설정
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Django Commerce 프록시: /commerce로 시작하는 모든 요청
    location ^~ /commerce {
        proxy_pass http://django-commerce:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        
        # CSRF 관련 헤더 추가
        proxy_set_header X-CSRFToken $http_x_csrftoken;
        proxy_set_header X-Requested-With $http_x_requested_with;
        
        # 타임아웃 설정
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Django 정적 파일 서빙 (FORCE_SCRIPT_NAME 고려)
    location ^~ /commerce/django-static/ {
        alias /var/www/html/django-staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # FastAPI 정적 파일 프록시
    location ^~ /python-static/ {
        proxy_pass http://python-api:8000/python-static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI 프록시: /python으로 시작하는 모든 요청
    location ^~ /python {
        proxy_pass http://python-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        
        # API 요청에 대한 타임아웃 설정
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Spring Boot 애플리케이션으로 프록시 (메인 서비스)
    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        
        # 타임아웃 설정
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # 버퍼 설정
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # 헬스체크 엔드포인트
    location /health {
        proxy_pass http://app:8080/actuator/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # 로그 설정
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}

