# 인증 비활성화 (개발/테스트 환경에서 사용)
  auth_enabled: false

  server:
    # HTTP API 서버가 수신할 포트 번호
    http_listen_port: 3100

  ingester:
    # 라이프사이클 관리 설정 (클러스터 내에서 ingester 인스턴스 관리)
    lifecycler:
      # 이 ingester의 주소 (다른 컴포넌트들이 접근할 수 있는 주소)
      address: 127.0.0.1
      # 해시 링 설정 (여러 ingester 간 데이터 분산을 위한 일관된 해싱)
      ring:
        kvstore:
          # 키-값 저장소 타입 (클러스터 상태 정보 저장용)
          store: inmemory
        # 데이터 복제 수 (단일 인스턴스이므로 1)
        replication_factor: 1
      # 종료 시 대기 시간 (graceful shutdown을 위한 시간)
      final_sleep: 0s
    wal:
      # Write-Ahead Log 디렉토리 (데이터 손실 방지를 위한 로그)
      dir: /loki/wal
    # 청크가 비활성화되기 전까지 대기 시간
    chunk_idle_period: 5m
    # 청크를 메모리에 보관하는 시간 (플러시 후에도)
    chunk_retain_period: 1m
    # 전송 재시도 횟수 (0은 재시도 없음)
    max_transfer_retries: 0

  # 스키마 설정 (인덱스와 청크 저장 방식 정의)
  schema_config:
    configs:
      - # 이 스키마가 적용되는 시작 날짜
        from: 2020-10-24
        # 인덱스 저장소 타입
        store: boltdb-shipper
        # 객체(청크) 저장소 타입
        object_store: filesystem
        # 스키마 버전
        schema: v11
        index:
          # 인덱스 파일 접두사
          prefix: index_
          # 인덱스 기간 (24시간마다 새 인덱스 파일 생성)
          period: 24h

  # 저장소 설정
  storage_config:
    boltdb_shipper:
      # 활성 인덱스가 저장되는 디렉토리
      active_index_directory: /loki/index
      # 캐시 파일 위치
      cache_location: /loki/cache
      # 캐시 TTL (Time To Live)
      cache_ttl: 24h
      # 공유 저장소 타입
      shared_store: filesystem
    filesystem:
      # 청크 파일들이 저장되는 디렉토리
      directory: /loki/chunks

  # 압축기 설정 (오래된 인덱스 파일들을 압축하여 성능 향상)
  compactor:
    # 압축 작업을 위한 임시 작업 디렉토리
    working_directory: /loki/compactor
    # 공유 저장소 타입
    shared_store: filesystem

  # 제한 설정 (리소스 사용량 및 데이터 검증 제한)
  limits_config:
    # 메트릭 이름 강제 적용 여부 (false면 더 유연한 라벨 사용 가능)
    enforce_metric_name: false
    # 오래된 샘플 거부 여부
    reject_old_samples: true
    # 거부할 오래된 샘플의 최대 기간 (168시간 = 7일)
    reject_old_samples_max_age: 168h

  # 테이블 관리자 설정 (데이터 보존 정책 관리)
  table_manager:
    # 보존 기간에 따른 자동 삭제 비활성화
    retention_deletes_enabled: false
    # 데이터 보존 기간 (0s는 무제한 보존)
    retention_period: 0s