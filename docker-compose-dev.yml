services:
  mysql:
    image: mysql:8.0
    container_name: study-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      MYSQL_DATABASE: study
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data-dev:/var/lib/mysql
    networks:
      - backend
  app:
    image: study-app:latest
    container_name: study-app
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/study?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQLDialect
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CAFE_RECOMMENDATION_BASE_URL=https://letsadam.shop/dir/
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    networks:
      - backend

  nginx:
    image: nginx:latest
    container_name: study-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d/app-dev.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt/live/letsadam.shop:/etc/letsencrypt/live/letsadam.shop:ro
      - /etc/letsencrypt/archive/letsadam.shop:/etc/letsencrypt/archive/letsadam.shop:ro
      - ./src/main/resources/static:/var/www/html
      - ./python-api/static:/var/www/html/static #파이썬 정적파일
    depends_on:
      - app
      - python-api
    networks:
      - backend

  python-api:
    build:
      context: ./python-api
      dockerfile: Dockerfile
    image: python-api:latest
    container_name: python-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATASOURCE_HOST=mysql
      - DATASOURCE_PORT=3306
      - DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - DATASOURCE_DB=study
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    env_file:
      - .env
    depends_on:
      - mysql
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  mysql-data-dev:
    driver: local
  app-logs:
    driver: local
  nginx-logs:
    driver: local