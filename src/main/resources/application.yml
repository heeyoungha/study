server:
  address: 0.0.0.0
  port: 8080

spring:
  profiles:
    group:
      local: [common, local]
      prod: [common, prod]
      dev: [common, dev]

---
spring:
  config:
    activate:
      on-profile: common

# 공통 설정들
logging:
  level:
    root: INFO
    org.springframework.security: DEBUG

kakao:
  rest:
    api:
      key: ${KAKAO_REST_API_KEY}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/study?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update # prod 배포시 validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: https://localhost/login/oauth2/code/google
            authorization-grant-type: authorization_code
            scope: # 기본 값 openid,profile,email => profile, email 로 설정 변경. openid가 scope에 있으면 Open Id Provider로 인식하기 때문
              - profile
              - email

# local 프로필용 설정들
logging:
  level:
    root: INFO
    org.springframework.security: DEBUG

cafe:
  recommendation:
    base:
      url: http://localhost:8080/dir/
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/study?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true&characterSetResults=UTF-8&connectionCollation=utf8mb4_unicode_ci&allowPublicKeyRetrieval=true
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update # prod 배포시 validate
      show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: https://letsadam.shop/login/oauth2/code/google
            authorization-grant-type: authorization_code
            scope: # 기본 값 openid,profile,email => profile, email 로 설정 변경. openid가 scope에 있으면 Open Id Provider로 인식하기 때문
              - profile
              - email
  # HTTPS 인식을 위한 설정
  web:
    resources:
      add-mappings: false
  # ForwardedHeaderFilter 활성화
  forward-headers-strategy: framework
logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
cafe:
  recommendation:
    base:
      url: https://letsadam.shop/dir/
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://sopt.cj6c6qseak8m.ap-northeast-2.rds.amazonaws.com:3306/sopt
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: https://letsadam.shop/login/oauth2/code/google
            authorization-grant-type: authorization_code
            scope: # 기본 값 openid,profile,email => profile, email 로 설정 변경. openid가 scope에 있으면 Open Id Provider로 인식하기 때문
              - profile
              - email
  # HTTPS 인식을 위한 설정
  web:
    resources:
      add-mappings: false
  # ForwardedHeaderFilter 활성화
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.tool.schema.internal.SchemaCreatorImpl: TRACE
    org.springframework.security: DEBUG

cafe:
  recommendation:
    base:
      url: http://3.36.241.20/dir # 고정 ip 할당 받은 후 변경 예정

