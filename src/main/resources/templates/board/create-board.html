<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>게시글 작성</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
  <div class="container">
    <h1>📝 게시글 작성</h1>
    
    <form id="boardForm">
      <div class="form-group">
        <label for="title">제목</label>
        <input type="text" name="title" id="title" required placeholder="게시글 제목을 입력하세요">
      </div>
      
      <div class="form-group">
        <label for="writer">작성자</label>
        <input type="text" name="writer" id="writer" required placeholder="작성자를 입력하세요">
      </div>
      
      <div class="form-group">
        <label for="content">내용</label>
        <textarea name="content" id="content" required placeholder="게시글 내용을 입력하세요"></textarea>
      </div>

      <button type="submit">등록</button>
    </form>
    
    <div class="nav-links">
      <a href="/boardList">📋 게시글 목록</a>
      <a href="/project">🏄🏻 프로젝트</a>
      <a href="/diary">📝 일기</a>
    </div>
  </div>

<script>
  document.getElementById('boardForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const formData = {
      title: document.getElementById('title').value,
      writer: document.getElementById('writer').value,
      content: document.getElementById('content').value
    };

    fetch('/board', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(formData)
    })
            .then(response => response.json())
            .then(data => {
              window.location.href = '/boardList';
            })
            .catch((error) => {
              console.error('Error:', error);
            });
  });
</script>
</body>
</html>
