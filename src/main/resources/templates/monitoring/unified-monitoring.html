<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통합 모니터링 대시보드</title>
    <link rel="stylesheet" href="/css/unified-monitoring.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 통합 모니터링 대시보드</h1>
            <p>모든 서비스의 상태를 한눈에 확인하세요</p>
        </div>

        <!-- 호스트 정보 섹션 제거 -->

        <div class="controls">
            <button class="btn" onclick="refreshAll()">🔄 새로고침</button>
            <button class="btn btn-danger" onclick="testAll500()">🧪 500 에러 테스트</button>
            <a href="http://localhost:3000" target="_blank" class="btn btn-primary">📊 Grafana 대시보드</a>
            <div class="refresh-info">자동 새로고침: 30초마다</div>
        </div>

        <div class="services-grid" id="servicesGrid">
            <div class="loading">
                <div class="spinner"></div>
                <div>서비스 정보를 불러오는 중...</div>
            </div>
        </div>
    </div>

    <!-- 모달 팝업 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🚧 준비중입니다</h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <p id="modalMessage"></p>
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="closeModal()">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const services = [
            {
                name: 'Spring Boot',
                url: '/monitoring/sys-health',
                port: 8080,
                color: '#e74c3c'
            },
            {
                name: 'Python FastAPI',
                url: '/python/admin/sys-health',
                port: 8000,
                color: '#3498db'
            },
            {
                name: 'Django Commerce',
                url: '/commerce/monitoring/sys-health/',
                port: 8002,
                color: '#2ecc71'
            }
        ];

        let refreshInterval;

        function createServiceCard(service) {
            return `
                <div class="service-card" id="card-${service.name.replace(/\s+/g, '-')}" onclick="openServiceMonitoring('${service.name}')">
                    <div class="service-header">
                        <div class="service-name">${service.name}</div>
                        <div class="service-status status-offline" id="status-${service.name.replace(/\s+/g, '-')}">
                            오프라인
                        </div>
                    </div>
                    
                    <div class="metrics-grid">
                        <div class="metric">
                            <div class="metric-label">CPU 사용률</div>
                            <div class="metric-value" id="cpu-${service.name.replace(/\s+/g, '-')}">--</div>
                            <div class="metric-unit">%</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">메모리 사용률</div>
                            <div class="metric-value" id="memory-${service.name.replace(/\s+/g, '-')}">--</div>
                            <div class="metric-unit">%</div>
                        </div>
                    </div>
                    
                    <div class="chart-container">
                        <div class="chart" id="chart-${service.name.replace(/\s+/g, '-')}">
                            <div class="chart-line"></div>
                        </div>
                    </div>
                    
                    <div class="error-logs" id="errors-${service.name.replace(/\s+/g, '-')}">
                        <div style="text-align: center; color: #666;">에러 로그 없음</div>
                    </div>
                    
                    <div class="service-footer">
                        <div class="click-hint">클릭하여 상세 모니터링 페이지로 이동</div>
                    </div>
                </div>
            `;
        }

        function updateServiceCard(service, data) {
            const cardId = service.name.replace(/\s+/g, '-');
            const statusEl = document.getElementById(`status-${cardId}`);
            const cpuEl = document.getElementById(`cpu-${cardId}`);
            const memoryEl = document.getElementById(`memory-${cardId}`);
            const errorsEl = document.getElementById(`errors-${cardId}`);

            // 상태 업데이트
            statusEl.textContent = '정상';
            statusEl.className = 'service-status status-healthy';

            // 메트릭 업데이트 (프로세스 기준 우선, 없으면 시스템 기준)
            const cpuPercent = data.cpu_percent || data.system_cpu_percent || 0;
            const memoryPercent = data.memory?.process_percent || data.memory?.process_heap_percent || data.memory?.system_percent || 0;
            
            cpuEl.textContent = cpuPercent.toFixed(1);
            memoryEl.textContent = memoryPercent.toFixed(1);

            // 에러 로그 업데이트
            if (data.recent_error_blocks && data.recent_error_blocks.length > 0) {
                errorsEl.innerHTML = data.recent_error_blocks.map(block => 
                    `<div class="error-log">${block}</div>`
                ).join('');
            } else {
                // 에러 로그 상태 정보가 있으면 표시
                const errorStatus = data.error_log_status || '에러 로그 없음';
                errorsEl.innerHTML = `<div style="text-align: center; color: #666;">${errorStatus}</div>`;
            }

            // 차트 업데이트 (간단한 히스토리 표시)
            updateChart(cardId, data.history || []);
        }

        function updateChart(cardId, history) {
            const chartEl = document.getElementById(`chart-${cardId}`);
            if (!chartEl) {
                console.error(`Chart element not found: chart-${cardId}`);
                return;
            }
            
            if (!history || history.length === 0) {
                // 데이터가 없을 때 기본 차트 표시
                chartEl.innerHTML = `
                    <svg width="100%" height="100%" viewBox="0 0 400 200">
                        <text x="200" y="100" text-anchor="middle" font-size="14" fill="#999">데이터 없음</text>
                    </svg>
                `;
                return;
            }

            const cpuData = history.map(h => h.cpu_percent || 0).filter(v => !isNaN(v));
            const memoryData = history.map(h => h.memory_percent || 0).filter(v => !isNaN(v));

            console.log(`Chart ${cardId}:`, { 
                historyLength: history.length, 
                cpuDataLength: cpuData.length, 
                memoryDataLength: memoryData.length,
                cpuData: cpuData,
                memoryData: memoryData
            });

            // 간단한 라인 차트 생성
            let svg = `<svg width="100%" height="100%" viewBox="0 0 400 250">`;
            
            // Y축 눈금과 값 추가
            for (let i = 0; i <= 4; i++) {
                const y = 250 - (i * 60);
                const value = i * 25;
                svg += `<line x1="0" y1="${y}" x2="400" y2="${y}" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5" />`;
                svg += `<text x="5" y="${y + 3}" font-size="12" fill="#666">${value}%</text>`;
            }
            
            // X축 눈금 (시간 표시) - 데이터 포인트가 많을 때는 일부만 표시
            if (cpuData.length > 1) {
                const step = Math.max(1, Math.floor(cpuData.length / 4));
                for (let i = 0; i < cpuData.length; i += step) {
                    const x = (i / (cpuData.length - 1)) * 400;
                    svg += `<line x1="${x}" y1="0" x2="${x}" y2="250" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5" />`;
                }
            }
            
            // CPU 차트 (파란색)
            if (cpuData.length >= 1) {
                if (cpuData.length === 1) {
                    // 데이터가 1개일 때는 수평선으로 표시
                    const y = 250 - (cpuData[0] / 100) * 250;
                    svg += `<line x1="0" y1="${y}" x2="400" y2="${y}" stroke="#3498db" stroke-width="3" />`;
                    svg += `<circle cx="200" cy="${y}" r="4" fill="#3498db" />`;
                    svg += `<text x="210" y="${y - 8}" font-size="10" fill="#3498db">${cpuData[0].toFixed(1)}%</text>`;
                } else {
                    // 여러 데이터 포인트일 때는 라인 차트
                    const cpuPoints = cpuData.map((v, i) => {
                        const x = (i / (cpuData.length - 1)) * 400;
                        const y = 250 - (v / 100) * 250;
                        return `${x},${y}`;
                    }).join(' ');
                    svg += `<polyline points="${cpuPoints}" fill="none" stroke="#3498db" stroke-width="3" />`;
                    
                    // CPU 값 표시 - 데이터 포인트가 많을 때는 일부만 표시
                    const step = Math.max(1, Math.floor(cpuData.length / 6));
                    cpuData.forEach((v, i) => {
                        if (i % step === 0 || i === cpuData.length - 1) {
                            const x = (i / (cpuData.length - 1)) * 400;
                            const y = 250 - (v / 100) * 250;
                            svg += `<circle cx="${x}" cy="${y}" r="4" fill="#3498db" />`;
                            svg += `<text x="${x + 8}" y="${y - 8}" font-size="10" fill="#3498db">${v.toFixed(1)}%</text>`;
                        }
                    });
                }
            }
            
            // 메모리 차트 (빨간색)
            if (memoryData.length >= 1) {
                if (memoryData.length === 1) {
                    // 데이터가 1개일 때는 수평선으로 표시
                    const y = 250 - (memoryData[0] / 100) * 250;
                    svg += `<line x1="0" y1="${y}" x2="400" y2="${y}" stroke="#e74c3c" stroke-width="3" />`;
                    svg += `<circle cx="200" cy="${y}" r="4" fill="#e74c3c" />`;
                    svg += `<text x="210" y="${y + 18}" font-size="10" fill="#e74c3c">${memoryData[0].toFixed(1)}%</text>`;
                } else {
                    // 여러 데이터 포인트일 때는 라인 차트
                    const memoryPoints = memoryData.map((v, i) => {
                        const x = (i / (memoryData.length - 1)) * 400;
                        const y = 250 - (v / 100) * 250;
                        return `${x},${y}`;
                    }).join(' ');
                    svg += `<polyline points="${memoryPoints}" fill="none" stroke="#e74c3c" stroke-width="3" />`;
                    
                    // 메모리 값 표시 - 데이터 포인트가 많을 때는 일부만 표시
                    const step = Math.max(1, Math.floor(memoryData.length / 6));
                    memoryData.forEach((v, i) => {
                        if (i % step === 0 || i === memoryData.length - 1) {
                            const x = (i / (memoryData.length - 1)) * 400;
                            const y = 250 - (v / 100) * 250;
                            svg += `<circle cx="${x}" cy="${y}" r="4" fill="#e74c3c" />`;
                            svg += `<text x="${x + 8}" y="${y + 18}" font-size="10" fill="#e74c3c">${v.toFixed(1)}%</text>`;
                        }
                    });
                }
            }
            
            svg += `</svg>`;
            chartEl.innerHTML = svg;
            
            // 범례를 chart-container에 직접 추가
            const chartContainer = chartEl.parentElement;
            if (chartContainer) {
                // 기존 범례 제거
                const existingLegend = chartContainer.querySelector('.chart-legend');
                if (existingLegend) {
                    existingLegend.remove();
                }
                
                // 새 범례 추가
                const legendHtml = `
                    <div class="chart-legend" style="position: absolute; top: 5px; left: 10px; z-index: 10;">
                        <span style="color: #3498db; font-weight: bold; font-size: 12px; margin-right: 15px;">CPU</span>
                        <span style="color: #e74c3c; font-weight: bold; font-size: 12px;">Memory</span>
                    </div>
                `;
                chartContainer.insertAdjacentHTML('beforeend', legendHtml);
            }
            
            console.log(`Chart ${cardId} updated successfully`);
        }

        function setServiceOffline(service) {
            const cardId = service.name.replace(/\s+/g, '-');
            const statusEl = document.getElementById(`status-${cardId}`);
            const cpuEl = document.getElementById(`cpu-${cardId}`);
            const memoryEl = document.getElementById(`memory-${cardId}`);

            statusEl.textContent = '오프라인';
            statusEl.className = 'service-status status-offline';
            cpuEl.textContent = '--';
            memoryEl.textContent = '--';
        }

        async function fetchServiceHealth(service) {
            try {
                const response = await fetch(service.url);
                if (response.ok) {
                    const data = await response.json();
                    updateServiceCard(service, data);
                } else {
                    setServiceOffline(service);
                }
            } catch (error) {
                console.error(`Error fetching ${service.name}:`, error);
                setServiceOffline(service);
            }
        }

        // 호스트 정보 관련 함수들 제거

        async function refreshAll() {
            // 호스트 정보 업데이트 제거
            
            // 서비스 정보 업데이트
            const promises = services.map(service => fetchServiceHealth(service));
            await Promise.all(promises);
        }

        async function testAll500() {
            const testUrls = [
                '/monitoring/test-500',
                '/python/admin/test-500',
                '/commerce/monitoring/test-500/'
            ];

            for (const url of testUrls) {
                try {
                    const response = await fetch(url);
                    if (response.status === 500) {
                        console.log(`500 에러 테스트 성공: ${url}`);
                    } else {
                        console.log(`예상과 다른 상태 코드: ${response.status} for ${url}`);
                    }
                } catch (error) {
                    console.log(`네트워크 오류: ${url} - ${error.message}`);
                }
            }

            // 3초 후 새로고침
            setTimeout(refreshAll, 3000);
        }

        function openServiceMonitoring(serviceName) {
            const serviceUrls = {
                'Spring Boot': '/admin/sys-health',
                'Python FastAPI': '/python/check-health',
                'Django Commerce': '/commerce/monitoring/sys-health/'
            };
            
            // Spring Boot와 Django는 준비중 팝업 표시
            if (serviceName === 'Spring Boot' || serviceName === 'Django Commerce') {
                showModal(serviceName + ' 모니터링 페이지는 현재 개발 중입니다.\n\nJSON 데이터만 확인 가능합니다.');
                return;
            }
            
            const url = serviceUrls[serviceName];
            if (url) {
                // 새 탭에서 모니터링 페이지 열기
                window.open(url, '_blank');
            }
        }

        function showModal(message) {
            const modal = document.getElementById('modal');
            const modalMessage = document.getElementById('modalMessage');
            modalMessage.textContent = message;
            modal.style.display = 'block';
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.style.display = 'none';
        }

        // 모달 외부 클릭 시 닫기
        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target === modal) {
                closeModal();
            }
        }

        function initializeDashboard() {
            const grid = document.getElementById('servicesGrid');
            grid.innerHTML = services.map(service => createServiceCard(service)).join('');
            
            // 초기 데이터 로드
            refreshAll();
            
            // 자동 새로고침 설정
            refreshInterval = setInterval(refreshAll, 30000);
        }

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', initializeDashboard);

        // 페이지 언로드 시 인터벌 정리
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>
</html>
