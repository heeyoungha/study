<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로젝트 생성</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
  <div class="container">
    <div class="form-header">
      <h1 id="formTitle">🚀 새 프로젝트 생성</h1>
      <p class="form-description">새로운 프로젝트를 시작해보세요! 목표를 설정하고 진행 상황을 관리할 수 있습니다.</p>
    </div>
    
    <form id="projectForm" class="enhanced-form" action="/project/create" method="post">
      <input type="hidden" id="projectId" name="projectId">
      <input type="hidden" id="targetMonthsInput" name="targetMonths">
      
      <div class="form-section">
        <div class="form-group">
          <label for="title">
            <span class="label-icon">📝</span>
            프로젝트 제목
          </label>
          <input
                  type="text"
                  id="title"
                  name="title"
                  required
                  placeholder="프로젝트 제목을 입력하세요"
                  class="enhanced-input"
          >
        </div>
        
        <div class="form-group">
          <label for="timeZone">
            <span class="label-icon">🕐</span>
            시간대
          </label>
          <input
                  type="text"
                  id="timeZone"
                  name="timeZone"
                  required
                  placeholder="예: 오전, 오후, 저녁, 새벽"
                  class="enhanced-input"
          >
        </div>
      </div>
      
      <div class="form-section">
        <div class="form-group">
          <label for="place">
            <span class="label-icon">📍</span>
            장소
          </label>
          <div style="display:flex; gap:8px; align-items:center;">
            <input
                    type="text"
                    id="place"
                    name="place"
                    required
                    placeholder="프로젝트 장소를 입력하세요"
                    class="enhanced-input"
                    style="flex:1; min-width:200px;"
            >
            <button type="button" id="findCafeBtn" class="btn btn-secondary" style="padding:8px 12px; border-radius:4px; border:1px solid #6c757d; background:white; color:#6c757d; cursor:pointer; white-space:nowrap; font-size:12px;">
              ☕ 카페 찾기
            </button>
          </div>
        </div>
        
        <div class="form-group">
          <label for="status">
            <span class="label-icon">📊</span>
            상태
          </label>
          <select
                  id="status"
                  name="status"
                  required
                  class="enhanced-select"
          >
            <option value="">상태를 선택하세요</option>
            <option value="TO_DO">시작전</option>
            <option value="IN_PROGRESS">진행중</option>
            <option value="ON_HOLD">보류</option>
            <option value="DONE">완료</option>
          </select>
        </div>
      </div>
      
      <div class="form-section">
        <div class="form-group full-width">
          <label for="monthGrid">
            <span class="label-icon">🎯</span>
            목표 월
          </label>
          <div class="month-selector-container">
            <div class="month-grid" id="monthGrid"></div>
            <div class="selected-months">
              <span class="selected-label">선택된 월:</span>
              <div class="tag-list" id="tagList"></div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="form-actions">
        <button type="submit" id="submitButton" class="enhanced-button">
          <span class="button-icon">🚀</span>
          프로젝트 생성
        </button>
        <button type="button" id="cancelButton" class="enhanced-button secondary" style="display: none;" onclick="window.location.href='/project'">
          <span class="button-icon">❌</span>
          취소
        </button>
      </div>
    </form>

    <div class="nav-links">
      <a href="/project">📋 프로젝트 목록</a>
      <a href="/diary">📝 일기 작성</a>
      <a href="/bookclub">📚 독서모임</a>
    </div>
  </div>

  <!-- 카페 찾기 모달 -->
  <div id="cafeModal" class="modal" style="display:none; position:fixed; left:0; top:0; width:100vw; height:100vh; background:rgba(0,0,0,0.3); z-index:1000;">
    <div class="modal-content" style="background:#fff; margin:5vh auto; padding:24px; border-radius:8px; max-width:600px; position:relative; max-height:90vh; overflow-y:auto;">
      <span class="close" onclick="closeCafeModal()" style="position:absolute; right:16px; top:8px; cursor:pointer; font-size:24px;">&times;</span>
      <h2>근처 카페 찾기</h2>
      
      <div style="margin-bottom:16px;">
        <label for="cafeAddress" style="display:block; margin-bottom:4px; font-weight:500;">주소 입력</label>
        <input type="text" id="cafeAddress" placeholder="주소를 입력하세요" style="width:100%; padding:8px 12px; border:1px solid #ddd; border-radius:4px; font-size:14px;">
      </div>
      
      <div id="cafeResults" style="display:none;">
        <h3>추천 카페 (최대 3개)</h3>
        <div id="cafeList" style="margin-top:12px;"></div>
      </div>
      
      <div id="cafeLoading" style="display:none; text-align:center; padding:20px;">
        <p>카페를 검색하고 있습니다...</p>
      </div>
    </div>
  </div>

<!-- Kakao 우편번호 서비스 -->
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

<script>
  var projectId = null;
  // 태그 관련 변수
  let tags = [];
  
  // 페이지 로드 시 수정 모드 체크
  window.onload = function() {
    projectId = getQueryParam('id');
    console.log(projectId);
    if (projectId) {
      setEditMode(projectId);
    } else {
      // URL에서 title 파라미터 확인
      const titleParam = getQueryParam('title');
      if (titleParam) {
        document.getElementById('title').value = decodeURIComponent(titleParam);
      }
    }
    
    // 월 선택기 설정
    setupMonthSelector();
  };

  // URL에서 쿼리 파라미터를 가져오는 함수
  function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
  }
  
  // 월 선택 설정
  function setupMonthSelector() {
    const monthGrid = document.getElementById('monthGrid');
    const months = [
      '1월', '2월', '3월', '4월', '5월', '6월',
      '7월', '8월', '9월', '10월', '11월', '12월'
    ];
    
    months.forEach(month => {
      const monthButton = document.createElement('button');
      monthButton.type = 'button';
      monthButton.className = 'month-button';
      monthButton.textContent = month;
      monthButton.onclick = () => toggleMonth(month);
      monthGrid.appendChild(monthButton);
    });
  }
  
  // 월 토글
  function toggleMonth(month) {
    const monthButton = event.target;
    if (tags.includes(month)) {
      // 월 제거
      tags = tags.filter(tag => tag !== month);
      monthButton.classList.remove('selected');
    } else {
      // 월 추가
      tags.push(month);
      monthButton.classList.add('selected');
    }
    renderTags();
  }
  
  // 태그 제거
  function removeTag(tagText) {
    tags = tags.filter(tag => tag !== tagText);
    // 월 버튼에서도 선택 해제
    const monthButtons = document.querySelectorAll('.month-button');
    monthButtons.forEach(button => {
      if (button.textContent === tagText) {
        button.classList.remove('selected');
      }
    });
    renderTags();
  }
  
  // 태그 렌더링
  function renderTags() {
    const tagList = document.getElementById('tagList');
    tagList.innerHTML = '';
    
    // 태그를 월 순서로 정렬
    const sortedTags = tags.sort((a, b) => {
      const monthA = parseInt(a.replace('월', ''));
      const monthB = parseInt(b.replace('월', ''));
      return monthA - monthB;
    });
    
    sortedTags.forEach(tag => {
      const tagElement = document.createElement('span');
      tagElement.className = 'tag';
      tagElement.onclick = () => sortTags(); // 태그 클릭 시 정렬
      tagElement.innerHTML = `
        ${tag}
        <span class="tag-remove" onclick="removeTag('${tag}')">&times;</span>
      `;
      tagList.appendChild(tagElement);
    });
  }
  
  // 태그 정렬 함수
  function sortTags() {
    renderTags(); // 이미 정렬된 상태로 렌더링
  }

  // 프로젝트 수정 모드 설정
  function setEditMode(projectId) {
    document.getElementById('formTitle').textContent = '🏄🏻 프로젝트 수정';
    document.getElementById('submitButton').textContent = '프로젝트 수정';
    document.getElementById('cancelButton').style.display = 'inline-block';

    // 프로젝트 데이터 가져오기
    fetch(`/api/project/${projectId}`)
            .then(response => response.json())
            .then(data => {
              document.getElementById('title').value = data.title;
              document.getElementById('startDate').value = data.startDate;
              document.getElementById('status').value = data.status;
              document.getElementById('place').value = data.place;
            })
            .catch(error => {
              console.error('Error:', error);
              alert('프로젝트 정보를 불러오는 중 오류가 발생했습니다.');
            });
  }

  // 카페 찾기 모달 열기
  document.getElementById('findCafeBtn').addEventListener('click', function() {
    document.getElementById('cafeModal').style.display = 'block';
  });

  // 카페 모달 닫기
  window.closeCafeModal = function() {
    document.getElementById('cafeModal').style.display = 'none';
  }

  // 카페 주소 입력 필드에 카카오 우편번호 API 연결
  document.getElementById('cafeAddress').addEventListener('click', function() {
    new daum.Postcode({
      oncomplete: function(data) {
        document.getElementById('cafeAddress').value = data.address;
        // 주소 입력 후 자동으로 검색 실행
        setTimeout(() => {
          searchCafes();
        }, 500);
      }
    }).open();
  });

  // ESC 키로 모달 닫기
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      if (document.getElementById('cafeModal').style.display === 'block') {
        closeCafeModal();
      }
    }
  });

  // 카페 검색 함수
  async function searchCafes() {
    const address = document.getElementById('cafeAddress').value;
    if (!address.trim()) {
      alert('주소를 입력해주세요.');
      return;
    }

    document.getElementById('cafeLoading').style.display = 'block';
    document.getElementById('cafeResults').style.display = 'none';

    try {
      const response = await fetch('/search', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: `address=${encodeURIComponent(address)}`
      });

      if (!response.ok) {
        throw new Error('카페 검색에 실패했습니다.');
      }

      const html = await response.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const cafeRows = doc.querySelectorAll('tbody tr');

      const cafeList = [];
      cafeRows.forEach(row => {
        const cells = row.querySelectorAll('td');
        if (cells.length >= 5) {
          cafeList.push({
            name: cells[0].textContent.trim(),
            address: cells[1].textContent.trim(),
            distance: cells[2].textContent.trim(),
            directionUrl: cells[3].querySelector('a')?.href || '',
            roadViewUrl: cells[4].querySelector('a')?.href || ''
          });
        }
      });

      displayCafeResults(cafeList);
    } catch (error) {
      console.error('Error:', error);
      alert('카페 검색 중 오류가 발생했습니다: ' + error.message);
    } finally {
      document.getElementById('cafeLoading').style.display = 'none';
    }
  }

  // 카페 결과 표시
  function displayCafeResults(cafes) {
    const cafeList = document.getElementById('cafeList');
    cafeList.innerHTML = '';

    if (cafes.length === 0) {
      cafeList.innerHTML = '<p style="color:#666; text-align:center;">검색된 카페가 없습니다.</p>';
      document.getElementById('cafeResults').style.display = 'block';
      return;
    }

    cafes.forEach((cafe, index) => {
      const cafeCard = document.createElement('div');
      cafeCard.style.cssText = 'border:1px solid #ddd; border-radius:8px; padding:16px; margin-bottom:12px; background:#f9f9f9;';
      
              cafeCard.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <h4 style="margin:0; color:#333; flex:1; margin-right:8px;">${cafe.name}</h4>
            <button onclick="selectCafe('${cafe.name}', '${cafe.address}')" style="padding:2px 6px; font-size:10px; border-radius:3px; border:none; background:#007bff; color:white; cursor:pointer; width:32px; height:20px; line-height:16px; text-align:center; flex-shrink:0;">
              선택
            </button>
          </div>
          <p style="margin:4px 0; color:#666; font-size:14px;"><strong>거리:</strong> ${cafe.distance}</p>
          <div style="margin-top:8px;">
            <a href="${cafe.directionUrl}" target="_blank" style="margin-right:8px; color:#007bff; text-decoration:none; font-size:12px;">길안내</a>
            <a href="${cafe.roadViewUrl}" target="_blank" style="color:#007bff; text-decoration:none; font-size:12px;">로드뷰</a>
          </div>
        `;
      
      cafeList.appendChild(cafeCard);
    });

    document.getElementById('cafeResults').style.display = 'block';
  }

  // 카페 선택
  window.selectCafe = function(name, address) {
    document.getElementById('place').value = name;
    closeCafeModal();
    
    // 선택된 카페 정보를 JSON으로 저장 (나중에 사용할 수 있도록)
    const cafeInfo = {
      name: name,
      address: address,
      selectedAt: new Date().toISOString()
    };
    localStorage.setItem('selectedCafe', JSON.stringify(cafeInfo));
  }

  // 폼 제출 처리
  document.getElementById('projectForm').addEventListener('submit', function(e) {
    // targetMonths를 hidden input에 설정
    document.getElementById('targetMonthsInput').value = tags.join(',');
  });
</script>
</body>
</html>
