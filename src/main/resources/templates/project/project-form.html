<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로젝트 생성</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
  <div class="container">
    <h1 id="formTitle">🏄🏻 새 프로젝트 생성</h1>
    
    <form id="projectForm">
      <input type="hidden" id="projectId" name="projectId">
      
      <div class="form-group">
        <label for="title">프로젝트 제목</label>
        <input
                type="text"
                id="title"
                name="title"
                required
                placeholder="프로젝트 제목을 입력하세요"
        >
      </div>
      
      <div class="form-group">
        <label for="startDate">시작 날짜</label>
        <input
                type="date"
                id="startDate"
                name="startDate"
                required
        >
      </div>
      
      <div class="form-group">
        <label for="place">장소</label>
        <input
                type="text"
                id="place"
                name="place"
                required
                placeholder="프로젝트 장소를 입력하세요"
        >
      </div>
      
      <div class="form-group">
        <label for="status">상태</label>
        <select
                id="status"
                name="status"
                required
        >
          <option value="">상태를 선택하세요</option>
          <option value="IN_PROGRESS">진행중</option>
          <option value="DONE">완료</option>
          <option value="ON_HOLD">보류</option>
          <option value="TO_DO">시작전</option>
        </select>
      </div>
      
      <button type="submit" id="submitButton">프로젝트 생성</button>
      <button type="button" id="cancelButton" style="display: none; margin-top: 10px;" onclick="window.location.href='/project'">취소</button>
    </form>
    
    <div class="nav-links">
      <a href="/project">📋 프로젝트 목록</a>
      <a href="/diary">📝 일기 작성</a>
      <a href="/bookclub">📚 독서모임</a>
    </div>
  </div>

<script>
  var projectId = null;
  // 페이지 로드 시 수정 모드 체크
  window.onload = function() {
    projectId = getQueryParam('id');
    console.log(projectId);
    if (projectId) {
      setEditMode(projectId);
    }
  };

  // URL에서 쿼리 파라미터를 가져오는 함수
  function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
  }

  // 프로젝트 수정 모드 설정
  function setEditMode(projectId) {
    document.getElementById('formTitle').textContent = '🏄🏻 프로젝트 수정';
    document.getElementById('submitButton').textContent = '프로젝트 수정';
    document.getElementById('cancelButton').style.display = 'inline-block';

    // 프로젝트 데이터 가져오기
    fetch(`/api/project/${projectId}`)
            .then(response => response.json())
            .then(data => {
              document.getElementById('title').value = data.title;
              document.getElementById('startDate').value = data.startDate;
              document.getElementById('status').value = data.status;
              document.getElementById('place').value = data.place;
            })
            .catch(error => {
              console.error('Error:', error);
              alert('프로젝트 정보를 불러오는 중 오류가 발생했습니다.');
            });
  }

  // 폼 제출 처리
  document.getElementById('projectForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const formData = {
      title: document.getElementById('title').value,
      startDate: document.getElementById('startDate').value,
      status: document.getElementById('status').value,
      place: document.getElementById('place').value,
    };

    const url = projectId ? `/api/project/${projectId}` : '/api/project';
    const method = projectId ? 'PUT' : 'POST';

    fetch(url, {
      method: method,
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(formData)
    })
      .then(response => {
        if (!response.ok) throw new Error('서버 오류가 발생했습니다.');
        alert(projectId ? '프로젝트가 성공적으로 수정되었습니다.' : '프로젝트가 성공적으로 생성되었습니다.');
        window.location.href = '/project';
      })
      .catch(error => {
        console.error('Error:', error);
        alert('오류가 발생했습니다.');
      });
  });
</script>
</body>
</html>
