<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로젝트 상세</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<div class="contents">
  <div class="container">
    <h1>프로젝트 상세</h1>
    <div class="mb-4">
      <label class="form-label">프로젝트 제목</label>
      <div class="form-control" id="title" th:text="${project.title}"></div>
    </div>
    <div class="mb-4">
      <label class="form-label">시작 날짜</label>
      <div class="form-control" id="startDate" th:text="${project.startDate}"></div>
    </div>
    <div class="button-group">
      <!-- <button class="btn btn-primary" onclick="window.location.href='/v1/project?id=' + [[${project.id}]]">수정</button>
      <button class="btn btn-danger" onclick="deleteProject([[${project.id}]])">삭제</button> -->
      <button class="btn btn-secondary" onclick="window.location.href='/v1/project'">목록</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script>
  function deleteProject(projectId) {
    if (!confirm('정말 삭제하시겠습니까?')) return;
    fetch(`/v1/api/project/${projectId}`, {
      method: 'DELETE'
    })
    .then(response => {
      if (!response.ok) throw new Error('삭제 실패');
      alert('삭제되었습니다.');
      window.location.href = '/v1/project';
    })
    .catch(error => {
      alert('삭제 중 오류 발생');
    });
  }
</script>
</body>
</html>
