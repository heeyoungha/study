<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Project</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>


  
  <div class="container">

    <!-- 공통 네비게이션 불러오기 -->
    <div th:replace="~{fragment/nav :: navigation}"></div>

    <h1>🏄🏻 프로젝트 관리</h1>

    <!-- 테이블 컨테이너 -->
    <div id="table-container">
              <table>
          <thead>
            <tr>
              <th class="filter-header" data-filter="quarters">
                분기 <span class="filter-icon">🔽</span>
                <div class="filter-dropdown" id="quartersFilter">
                  <div class="filter-option" data-value="">전체</div>
                  <div class="filter-option" data-value="1분기">1분기</div>
                  <div class="filter-option" data-value="2분기">2분기</div>
                  <div class="filter-option" data-value="3분기">3분기</div>
                  <div class="filter-option" data-value="4분기">4분기</div>
                </div>
              </th>
              <th class="sortable-header" data-sort="title">
                프로젝트 <span class="sort-icon">↕</span>
              </th>
              <th class="sortable-header" data-sort="timeZone">
                시간대 <span class="sort-icon">↕</span>
              </th>
              <th class="sortable-header" data-sort="place">
                장소 <span class="sort-icon">↕</span>
              </th>
              <th class="filter-header" data-filter="status">
                상태 <span class="filter-icon">🔽</span>
                <div class="filter-dropdown" id="statusFilter">
                  <div class="filter-option" data-value="">전체</div>
                  <div class="filter-option" data-value="TO_DO">시작전</div>
                  <div class="filter-option" data-value="IN_PROGRESS">진행중</div>
                  <div class="filter-option" data-value="ON_HOLD">보류</div>
                  <div class="filter-option" data-value="DONE">완료</div>
                </div>
              </th>
            </tr>
          </thead>
        <tbody id="project-list">
          <!-- JS로 동적으로 행을 추가 -->
        </tbody>
      </table>
      
      <!-- 로딩 인디케이터 -->
      <div id="loadingIndicator" class="loading-indicator" style="display: none;">
        <div class="spinner"></div>
        <p>프로젝트를 불러오는 중...</p>
      </div>
      
      <!-- 더 이상 데이터가 없음을 표시 -->
      <div id="noMoreData" class="no-more-data" style="display: none;">
        <p>더 이상 불러올 프로젝트가 없습니다.</p>
        <div class="nav-links">
          <a href="/project/create">🚀 새 프로젝트 생성</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Project Modal -->
  <div id="projectModal" class="modal" style="display:none; position:fixed; left:0; top:0; width:100vw; height:100vh; background:rgba(0,0,0,0.3); z-index:1000;">
    <div class="modal-content" style="background:#fff; margin:5vh auto; padding:24px; border-radius:8px; max-width:500px; position:relative; max-height:90vh; overflow-y:auto;">
      <span class="close" style="position:absolute; right:16px; top:8px; cursor:pointer; font-size:24px;">&times;</span>
      <h2 id="modalTitle">프로젝트 수정</h2>
      
      <form id="editProjectForm">
        <input type="hidden" id="editProjectId" name="id">
        
        <div style="margin-bottom:16px;">
          <label for="editTitle" style="display:block; margin-bottom:4px; font-weight:500;">프로젝트 제목</label>
          <input type="text" id="editTitle" name="title" required style="width:100%; padding:8px 12px; border:1px solid #ddd; border-radius:4px; font-size:14px;">
        </div>
        
        <div style="margin-bottom:16px;">
          <label for="editTimeZone" style="display:block; margin-bottom:4px; font-weight:500;">시간대</label>
          <input type="text" id="editTimeZone" name="timeZone" required style="width:100%; padding:8px 12px; border:1px solid #ddd; border-radius:4px; font-size:14px;">
        </div>
        
        <div style="margin-bottom:16px;">
          <label for="editPlace" style="display:block; margin-bottom:4px; font-weight:500;">장소</label>
          <div style="display:flex; gap:8px; align-items:center;">
            <input type="text" id="editPlace" name="place" required style="flex:1; min-width:200px; padding:8px 12px; border:1px solid #ddd; border-radius:4px; font-size:14px;">
            <button type="button" id="editFindCafeBtn" class="btn btn-secondary" style="padding:8px 12px; border-radius:4px; border:1px solid #6c757d; background:white; color:#6c757d; cursor:pointer; white-space:nowrap; font-size:12px;">
              ☕ 카페 찾기
            </button>
          </div>
        </div>
        
        <div style="margin-bottom:16px;">
          <label for="editStatus" style="display:block; margin-bottom:4px; font-weight:500;">상태</label>
          <select id="editStatus" name="status" required style="width:100%; padding:8px 12px; border:1px solid #ddd; border-radius:4px; font-size:14px;">
            <option value="">상태를 선택하세요</option>
            <option value="TO_DO">시작전</option>
            <option value="IN_PROGRESS">진행중</option>
            <option value="ON_HOLD">보류</option>
            <option value="DONE">완료</option>
          </select>
        </div>
        
        <div style="margin-bottom:16px;">
          <label style="display:block; margin-bottom:4px; font-weight:500;">목표 월</label>
          <div id="editMonthGrid" style="display:grid; grid-template-columns:repeat(6, 1fr); gap:4px; margin-bottom:8px;"></div>
          <div id="editSelectedMonths" style="font-size:12px; color:#666;">
            선택된 월: <span id="editMonthTags"></span>
          </div>
        </div>
        
        <div style="margin-top:24px; display:flex; justify-content:space-between; gap:12px;">
          <button type="submit" id="updateProjectBtn" class="btn btn-primary" style="flex:1; padding:12px 20px; border-radius:6px; border:none; background:#007bff; color:white; font-weight:500; cursor:pointer; transition:all 0.2s; box-shadow:0 2px 4px rgba(0,123,255,0.2);" onmouseover="this.style.background='#0056b3'; this.style.transform='translateY(-1px)'; this.style.boxShadow='0 4px 8px rgba(0,123,255,0.3)'" onmouseout="this.style.background='#007bff'; this.style.transform='translateY(0)'; this.style.boxShadow='0 2px 4px rgba(0,123,255,0.2)'">
            <span class="button-icon">💾</span>
            수정 완료
          </button>
          <button type="button" id="closeModalBtn" class="btn btn-secondary" style="flex:1; padding:12px 20px; border-radius:6px; border:1px solid #6c757d; background:white; color:#6c757d; font-weight:500; cursor:pointer; transition:all 0.2s;" onmouseover="this.style.background='#f8f9fa'; this.style.borderColor='#5a6268'; this.style.color='#495057'; this.style.transform='translateY(-1px)'" onmouseout="this.style.background='white'; this.style.borderColor='#6c757d'; this.style.color='#6c757d'; this.style.transform='translateY(0)'">
            <span class="button-icon">❌</span>
            취소
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 카페 찾기 모달 (수정용) -->
  <div id="editCafeModal" class="modal" style="display:none; position:fixed; left:0; top:0; width:100vw; height:100vh; background:rgba(0,0,0,0.3); z-index:1000;">
    <div class="modal-content" style="background:#fff; margin:5vh auto; padding:24px; border-radius:8px; max-width:600px; position:relative; max-height:90vh; overflow-y:auto;">
      <span class="close" onclick="closeEditCafeModal()" style="position:absolute; right:16px; top:8px; cursor:pointer; font-size:24px;">&times;</span>
      <h2>근처 카페 찾기</h2>
      
      <div style="margin-bottom:16px;">
        <label for="editCafeAddress" style="display:block; margin-bottom:4px; font-weight:500;">주소 입력</label>
        <input type="text" id="editCafeAddress" placeholder="주소를 입력하세요" style="width:100%; padding:8px 12px; border:1px solid #ddd; border-radius:4px; font-size:14px;">
      </div>
      
      <div id="editCafeResults" style="display:none;">
        <h3>추천 카페</h3>
        <div id="editCafeList" style="margin-top:12px;"></div>
      </div>
      
      <div id="editCafeLoading" style="display:none; text-align:center; padding:20px;">
        <p>카페를 검색하고 있습니다...</p>
      </div>
    </div>
  </div>

<!-- Kakao 우편번호 서비스 -->
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const projectList = document.getElementById('project-list');
    const editModal = document.getElementById('editModal');
    const closeBtn = document.querySelector('.close');
    const createProjectBtn = document.getElementById('create-project-btn');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const noMoreData = document.getElementById('noMoreData');
    const sortableHeaders = document.querySelectorAll('.sortable-header');
    const filterHeaders = document.querySelectorAll('.filter-header');
    
    let currentProjectId = null;
    let currentPage = 0;
    let isLoading = false;
    let hasMoreData = true;
    let currentSort = { field: 'id', direction: 'desc' };
    let currentFilters = { quarters: '', status: '' };
    let allProjects = [];
    let filteredProjects = [];

    // 프로젝트 데이터 로드
    async function loadProjects(page = 0, reset = false) {
      if (isLoading) return;
      
      isLoading = true;
      loadingIndicator.style.display = 'block';
      
      try {
        const response = await fetch('/api/project');
        if (!response.ok) throw new Error('프로젝트 목록을 불러올 수 없습니다');
        
        const data = await response.json();
        allProjects = data.content || [];
        
        // 필터링 및 정렬 적용
        applyFiltersAndSort();
        
      } catch (error) {
        console.error('Error:', error);
        alert('프로젝트 목록을 불러오는 중 오류가 발생했습니다.');
      } finally {
        isLoading = false;
        loadingIndicator.style.display = 'none';
      }
    }

    // 프로젝트 상세 정보 조회
    async function showProjectDetails(projectId) {
      try {
        const response = await fetch(`/api/project/${projectId}`);
        if (!response.ok) throw new Error('프로젝트 정보를 불러올 수 없습니다');

        const project = await response.json();
        showModal(project);
      } catch (error) {
        console.error('Error:', error);
        alert(error.message);
      }
    }

    // 모달 표시 (수정 모드)
    function showModal(project) {
      // 폼 필드에 데이터 설정
      document.getElementById('editProjectId').value = project.id;
      document.getElementById('editTitle').value = project.title || '';
      document.getElementById('editTimeZone').value = project.timeZone || '';
      document.getElementById('editPlace').value = project.place || '';
      document.getElementById('editStatus').value = project.status || '';
      
      // 목표 월 설정
      setupEditMonthSelector();
      if (project.targetMonths) {
        const months = project.targetMonths.split(',').map(m => m.trim());
        setSelectedMonths(months);
      }
      
      document.getElementById('projectModal').style.display = 'block';
    }

    // 수정 모드용 월 선택기 설정
    function setupEditMonthSelector() {
      const monthGrid = document.getElementById('editMonthGrid');
      monthGrid.innerHTML = '';
      
      const months = [
        '1월', '2월', '3월', '4월', '5월', '6월',
        '7월', '8월', '9월', '10월', '11월', '12월'
      ];
      
      months.forEach(month => {
        const monthButton = document.createElement('button');
        monthButton.type = 'button';
        monthButton.className = 'edit-month-button';
        monthButton.textContent = month;
        monthButton.style.cssText = 'padding:6px; border:1px solid #ddd; background:white; border-radius:4px; cursor:pointer; font-size:12px; transition:all 0.2s; color:#333;';
        monthButton.onclick = () => toggleEditMonth(month, monthButton);
        monthGrid.appendChild(monthButton);
      });
    }
    
    // 수정 모드 월 토글
    function toggleEditMonth(month, button) {
      if (button.classList.contains('selected')) {
        button.classList.remove('selected');
        button.style.background = 'white';
        button.style.color = '#333';
      } else {
        button.classList.add('selected');
        button.style.background = '#007bff';
        button.style.color = 'white';
      }
      updateEditMonthTags();
    }
    
    // 선택된 월 설정
    function setSelectedMonths(months) {
      const buttons = document.querySelectorAll('.edit-month-button');
      buttons.forEach(button => {
        if (months.includes(button.textContent)) {
          button.classList.add('selected');
          button.style.background = '#007bff';
          button.style.color = 'white';
        }
      });
      updateEditMonthTags();
    }
    
    // 수정 모드 월 태그 업데이트
    function updateEditMonthTags() {
      const selectedButtons = document.querySelectorAll('.edit-month-button.selected');
      const selectedMonths = Array.from(selectedButtons).map(btn => btn.textContent);
      document.getElementById('editMonthTags').textContent = selectedMonths.join(', ') || '없음';
    }
    
    // 모달 닫기
    function closeModal() {
      document.getElementById('projectModal').style.display = 'none';
    }

    // 상태 옵션 생성
    function createStatusOptions(currentStatus) {
      const statusMap = {
        'IN_PROGRESS': '진행중',
        'DONE': '완료',
        'ON_HOLD': '보류',
        'TO_DO': '시작전'
      };

      let options = '';
      for (const [value, label] of Object.entries(statusMap)) {
        const selected = currentStatus === value ? 'selected' : '';
        options += `<option value="${value}" ${selected}>${label}</option>`;
      }
      return options;
    }

    // 프로젝트 항목 추가
    function addProjectToList(project) {
      const tr = document.createElement('tr');
      const statusMap = {
        'IN_PROGRESS': { label: '진행중', class: 'status-in_progress' },
        'DONE': { label: '완료', class: 'status-done' },
        'ON_HOLD': { label: '보류', class: 'status-on_hold' },
        'TO_DO': { label: '시작전', class: 'status-to_do' }
      };
      const status = statusMap[project.status] || { label: project.status, class: '' };

      tr.innerHTML = `
        <td>${project.quarters || '-'}</td>
        <td>
          <a href="#" class="project-name" data-id="${project.id}">
            ${project.title}
          </a>
        </td>
        <td>${project.timeZone || '-'}</td>
        <td>${project.place || '-'}</td>
        <td>
          <span class="status-tag ${status.class}" data-id="${project.id}" data-status="${project.status}">
            ${status.label}
          </span>
        </td>
      `;

      // 프로젝트 이름 클릭 이벤트
      tr.querySelector('.project-name').addEventListener('click', function(e) {
        e.preventDefault();
        showProjectDetails(project.id);
      });

      // 상태 태그 클릭 이벤트 (추후 상태 변경 UI 연결)
      tr.querySelector('.status-tag').addEventListener('click', function(e) {
        // TODO: 상태 변경 UI 오픈
        alert('상태 변경 기능은 추후 지원 예정입니다.');
      });

      document.getElementById('project-list').appendChild(tr);
    }

    // 빈 상태 메시지 표시
    function showEmptyMessage() {
      const tbody = document.getElementById('project-list');
      const noMoreDataVisible = noMoreData.style.display === 'block';
      
      tbody.innerHTML = `
        <tr>
          <td colspan="5">
            <div class="empty">
              <p>프로젝트가 없습니다.</p>
              ${!noMoreDataVisible ? `
                <div class="empty-actions">
                  <a href="/project/create" class="btn btn-primary">
                    <span class="button-icon">🚀</span>
                    새 프로젝트 생성
                  </a>
                </div>
              ` : ''}
            </div>
          </td>
        </tr>
      `;
    }

    // 필터링 및 정렬 적용
    function applyFiltersAndSort() {
      // 필터링 적용
      let filtered = [...allProjects];
      
      // 분기 필터링
      if (currentFilters.quarters) {
        filtered = filtered.filter(project => 
          project.quarters && project.quarters.includes(currentFilters.quarters)
        );
      }
      
      // 상태 필터링
      if (currentFilters.status) {
        filtered = filtered.filter(project => 
          project.status === currentFilters.status
        );
      }
      
      // 정렬 적용
      filtered.sort((a, b) => {
        let aValue = a[currentSort.field] || '';
        let bValue = b[currentSort.field] || '';
        
        if (typeof aValue === 'string') aValue = aValue.toLowerCase();
        if (typeof bValue === 'string') bValue = bValue.toLowerCase();
        
        if (currentSort.direction === 'asc') {
          return aValue > bValue ? 1 : -1;
        } else {
          return aValue < bValue ? 1 : -1;
        }
      });
      
      filteredProjects = filtered;
      renderProjects();
    }

    // 프로젝트 렌더링
    function renderProjects() {
      projectList.innerHTML = '';
      
      if (filteredProjects.length === 0) {
        showEmptyMessage();
        return;
      }
      
      // 페이지네이션 적용 (한 번에 10개씩)
      const startIndex = currentPage * 10;
      const endIndex = startIndex + 10;
      const pageProjects = filteredProjects.slice(startIndex, endIndex);
      
      pageProjects.forEach(project => addProjectToList(project));
      
      // 더 많은 데이터가 있는지 확인
      hasMoreData = endIndex < filteredProjects.length;
      if (!hasMoreData) {
        noMoreData.style.display = 'block';
      } else {
        noMoreData.style.display = 'none';
      }
    }

    // 헤더 클릭 이벤트 처리
    function handleHeaderClick(field) {
      const header = document.querySelector(`[data-sort="${field}"]`);
      
      // 정렬 방향 변경
      if (currentSort.field === field) {
        currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
      } else {
        currentSort.field = field;
        currentSort.direction = 'asc';
      }
      
      // 모든 헤더의 아이콘 초기화
      document.querySelectorAll('.sort-icon').forEach(icon => {
        icon.textContent = '↕';
      });
      
      // 현재 헤더의 아이콘 업데이트
      const icon = header.querySelector('.sort-icon');
      icon.textContent = currentSort.direction === 'asc' ? '↑' : '↓';
      
      // 정렬 적용
      applyFiltersAndSort();
    }

    // 필터 드롭다운 토글
    function toggleFilterDropdown(filterType) {
      const dropdown = document.getElementById(filterType + 'Filter');
      const allDropdowns = document.querySelectorAll('.filter-dropdown');
      
      // 다른 드롭다운들 닫기
      allDropdowns.forEach(dd => {
        if (dd !== dropdown) {
          dd.style.display = 'none';
        }
      });
      
      // 현재 드롭다운 토글
      if (dropdown.style.display === 'block') {
        dropdown.style.display = 'none';
      } else {
        dropdown.style.display = 'block';
      }
    }

    // 필터 옵션 선택
    function selectFilterOption(filterType, value) {
      currentFilters[filterType] = value;
      
      // 필터 아이콘 업데이트
      const header = document.querySelector(`[data-filter="${filterType}"]`);
      const icon = header.querySelector('.filter-icon');
      icon.textContent = value ? '🔽' : '🔽';
      
      // 드롭다운 닫기
      document.getElementById(filterType + 'Filter').style.display = 'none';
      
      // 필터 적용
      applyFiltersAndSort();
    }

    // 스크롤 이벤트 (인피니티 스크롤)
    function handleScroll() {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 1000) {
        if (hasMoreData && !isLoading) {
          currentPage++;
          renderProjects();
        }
      }
    }

    // 헤더 클릭 이벤트
    sortableHeaders.forEach(header => {
      header.addEventListener('click', function() {
        const field = this.getAttribute('data-sort');
        handleHeaderClick(field);
      });
    });

    // 필터 헤더 클릭 이벤트
    filterHeaders.forEach(header => {
      header.addEventListener('click', function() {
        const filterType = this.getAttribute('data-filter');
        toggleFilterDropdown(filterType);
      });
    });

    // 필터 옵션 클릭 이벤트
    document.querySelectorAll('.filter-option').forEach(option => {
      option.addEventListener('click', function() {
        const filterType = this.closest('.filter-dropdown').id.replace('Filter', '');
        const value = this.getAttribute('data-value');
        selectFilterOption(filterType, value);
      });
    });

    // 드롭다운 외부 클릭 시 닫기
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.filter-header')) {
        document.querySelectorAll('.filter-dropdown').forEach(dd => {
          dd.style.display = 'none';
        });
      }
    });

    // 모달 닫기 버튼 이벤트
    document.querySelector('.close').addEventListener('click', closeModal);
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    
    // 수정 폼 제출 이벤트
    document.getElementById('editProjectForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const projectId = document.getElementById('editProjectId').value;
      const selectedMonths = Array.from(document.querySelectorAll('.edit-month-button.selected'))
        .map(btn => btn.textContent);
      
      const formData = {
        id: projectId,
        title: document.getElementById('editTitle').value,
        timeZone: document.getElementById('editTimeZone').value,
        place: document.getElementById('editPlace').value,
        status: document.getElementById('editStatus').value,
        targetMonths: selectedMonths.join(',')
      };
      
      try {
        const response = await fetch(`/api/project/${projectId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(formData)
        });
        
        if (!response.ok) {
          throw new Error('프로젝트 수정에 실패했습니다');
        }
        
        alert('프로젝트가 성공적으로 수정되었습니다!');
        closeModal();
        // 프로젝트 목록 새로고침
        loadProjects();
        
      } catch (error) {
        console.error('Error:', error);
        alert('프로젝트 수정 중 오류가 발생했습니다: ' + error.message);
      }
    });

    // 수정 모달 카페 찾기 기능
    document.getElementById('editFindCafeBtn').addEventListener('click', function() {
      document.getElementById('editCafeModal').style.display = 'block';
    });

    // 수정 모달 카페 모달 닫기
    window.closeEditCafeModal = function() {
      document.getElementById('editCafeModal').style.display = 'none';
    }

    // 수정 모달 카페 주소 입력 필드에 카카오 우편번호 API 연결
    document.getElementById('editCafeAddress').addEventListener('click', function() {
      new daum.Postcode({
        oncomplete: function(data) {
          document.getElementById('editCafeAddress').value = data.address;
          // 주소 입력 후 자동으로 검색 실행
          setTimeout(() => {
            searchEditCafes();
          }, 500);
        }
      }).open();
    });

    // ESC 키로 모달 닫기
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        if (document.getElementById('editCafeModal').style.display === 'block') {
          closeEditCafeModal();
        } else if (document.getElementById('projectModal').style.display === 'block') {
          closeModal();
        }
      }
    });

    // 수정 모달 카페 검색 함수
    async function searchEditCafes() {
      const address = document.getElementById('editCafeAddress').value;
      if (!address.trim()) {
        alert('주소를 입력해주세요.');
        return;
      }

      document.getElementById('editCafeLoading').style.display = 'block';
      document.getElementById('editCafeResults').style.display = 'none';

      try {
        const response = await fetch('/search', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: `address=${encodeURIComponent(address)}`
        });

        if (!response.ok) {
          throw new Error('카페 검색에 실패했습니다.');
        }

        const html = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const cafeRows = doc.querySelectorAll('tbody tr');

        const cafeList = [];
        cafeRows.forEach(row => {
          const cells = row.querySelectorAll('td');
          if (cells.length >= 5) {
            cafeList.push({
              name: cells[0].textContent.trim(),
              address: cells[1].textContent.trim(),
              distance: cells[2].textContent.trim(),
              directionUrl: cells[3].querySelector('a')?.href || '',
              roadViewUrl: cells[4].querySelector('a')?.href || ''
            });
          }
        });

        displayEditCafeResults(cafeList);
      } catch (error) {
        console.error('Error:', error);
        alert('카페 검색 중 오류가 발생했습니다: ' + error.message);
      } finally {
        document.getElementById('editCafeLoading').style.display = 'none';
      }
    }

    // 수정 모달 카페 결과 표시
    function displayEditCafeResults(cafes) {
      const cafeList = document.getElementById('editCafeList');
      cafeList.innerHTML = '';

      if (cafes.length === 0) {
        cafeList.innerHTML = '<p style="color:#666; text-align:center;">검색된 카페가 없습니다.</p>';
        document.getElementById('editCafeResults').style.display = 'block';
        return;
      }

      cafes.forEach((cafe, index) => {
        const cafeCard = document.createElement('div');
        cafeCard.style.cssText = 'border:1px solid #ddd; border-radius:8px; padding:16px; margin-bottom:12px; background:#f9f9f9;';
        
        cafeCard.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <h4 style="margin:0; color:#333; flex:1; margin-right:8px;">${cafe.name}</h4>
            <button onclick="selectEditCafe('${cafe.name}', '${cafe.address}')" style="padding:2px 6px; font-size:10px; border-radius:3px; border:none; background:#007bff; color:white; cursor:pointer; width:32px; height:20px; line-height:16px; text-align:center; flex-shrink:0;">
              선택
            </button>
          </div>
          <p style="margin:4px 0; color:#666; font-size:14px;"><strong>거리:</strong> ${cafe.distance}</p>
          <div style="margin-top:8px;">
            <a href="${cafe.directionUrl}" target="_blank" style="margin-right:8px; color:#007bff; text-decoration:none; font-size:12px;">길안내</a>
            <a href="${cafe.roadViewUrl}" target="_blank" style="color:#007bff; text-decoration:none; font-size:12px;">로드뷰</a>
          </div>
        `;
        
        cafeList.appendChild(cafeCard);
      });

      document.getElementById('editCafeResults').style.display = 'block';
    }

    // 수정 모달 카페 선택
    window.selectEditCafe = function(name, address) {
      document.getElementById('editPlace').value = name;
      closeEditCafeModal();
      
      // 선택된 카페 정보를 JSON으로 저장 (나중에 사용할 수 있도록)
      const cafeInfo = {
        name: name,
        address: address,
        selectedAt: new Date().toISOString()
      };
      localStorage.setItem('selectedEditCafe', JSON.stringify(cafeInfo));
    }

    // 스크롤 이벤트 리스너
    window.addEventListener('scroll', handleScroll);

    // ESC 키로 모달 닫기
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });

    // 초기 데이터 로드
    loadProjects();

    // 프로젝트 삭제
    window.deleteProject = function(id) {
      if (confirm('Are you sure you want to delete this project?')) {
        fetch(`/api/project/${id}`, {
          method: 'DELETE'
        })
        .then(response => {
          if (!response.ok) throw new Error('삭제 실패');
          alert('프로젝트가 삭제되었습니다.');
          location.reload();
        })
        .catch(error => {
          console.error('Error:', error);
          alert('삭제 중 오류가 발생했습니다.');
        });
      }
    };

    //프로젝트 리스트 조회 (간단한 버전)
    function loadProjects() {
      if (isLoading) return;
      
      isLoading = true;
      loadingIndicator.style.display = 'block';
      
      fetch('/api/project')
        .then(response => response.json())
        .then(data => {
          allProjects = data.content || [];
          applyFiltersAndSort();
        })
        .catch(error => {
          console.error('Error loading projects:', error);
          alert('프로젝트 목록을 불러오는 중 오류가 발생했습니다.');
        })
        .finally(() => {
          isLoading = false;
          loadingIndicator.style.display = 'none';
        });
    }
    // 초기 프로젝트 목록 로드
    loadProjects();
  });
</script>
</body>
</html>
