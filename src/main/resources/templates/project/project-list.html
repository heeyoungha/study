<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Project</title>
  <link rel="stylesheet" th:href="@{/css/nav.css}">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"> <!-- Bootstrap CSS 추가 -->
</head>
<body>
<div class="container">
  <!-- 공통 네비게이션 불러오기 -->
  <div th:replace="~{fragment/nav :: navigation}"></div>

  <h1>Project Management</h1>

  <form>
    <button id="create-project-form" type="submit">Create Project</button>
  </form>

  <table class="table table-hover"> <!-- Bootstrap 클래스 추가 -->
    <thead>
    <tr>
      <th>시작일자</th>
      <th>프로젝트</th>
      <th>장소</th>
      <th>상태</th>
    </tr>
    </thead>
    <tbody id="project-list">
      <!-- JS로 동적으로 행을 추가 -->
    </tbody>
  </table>

  <!-- 검색기능 -->
  <form th:action="@{/project}" method="get" class="input-group mb-3"> <!-- Bootstrap 클래스 추가 -->
    <input type="text" name="searchKeyword" class="form-control" placeholder="검색어를 입력하세요" th:value="${searchKeyword}">
    <div class="input-group-append">
      <button type="submit" class="btn btn-primary">검색</button>
    </div>
  </form>

  <!-- 페이징 -->
  <div th:if="${!projectList.isEmpty()}" class="pagination-container">
    <ul class="pagination"
        th:with="
                    pageNumber = ${projectList.pageable.pageNumber},
                    pageSize = ${projectList.pageable.pageSize},
                    totalPages = ${projectList.totalPages},
                    startPage = ${T(java.lang.Math).floor(pageNumber / pageSize) * pageSize + 1},
                    tempEndPage = ${startPage + pageSize - 1},
                    endPage = (${tempEndPage < totalPages ? tempEndPage : totalPages})">

      <li th:classappend="${projectList.first} ? 'disabled'" class="page-item">
        <a class="page-link" th:href="${projectList.first} ? '#' : @{/(page=${pageNumber - 1})}">
          <span aria-hidden="true"><</span>
        </a>
      </li>

      <li th:each="page: ${#numbers.sequence(startPage, endPage)}" th:classappend="${page == pageNumber + 1} ? 'active'" class="page-item">
        <a th:text="${page}" class="page-link" th:href="@{/(page=${page - 1})}"></a>
      </li>

      <li th:classappend="${projectList.last} ? 'disabled'" class="page-item">
        <a class="page-link" th:href="${projectList.last} ? '#' : @{/(page=${pageNumber + 1})}" aria-label="Next">
          <span aria-hidden="true">&gt;</span>
        </a>
      </li>
    </ul>
  </div>
</div>

<!-- Show Project Detail -->
<div id="projectModal" class="modal" style="display:none; position:fixed; left:0; top:0; width:100vw; height:100vh; background:rgba(0,0,0,0.3); z-index:1000;">
  <div class="modal-content" style="background:#fff; margin:10vh auto; padding:24px; border-radius:8px; max-width:400px; position:relative;">
    <span class="close" style="position:absolute; right:16px; top:8px; cursor:pointer; font-size:24px;">&times;</span>
    <h2 id="modalTitle"></h2>
    <p><strong>시작일자:</strong> <span id="modalStartDate"></span></p>
    <p><strong>장소:</strong> <span id="modalPlace"></span></p>
    <p><strong>상태:</strong> <span id="modalStatus"></span></p>
  </div>
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2>Edit Project</h2>
    <form id="edit-project-form">
      <input type="text" id="edit-project-name" required>
      <button type="submit">Save Changes</button>
    </form>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const projectList = document.getElementById('project-list');
    const editModal = document.getElementById('editModal');
    const closeBtn = document.querySelector('.close');
    let currentProjectId = null;


    // 프로젝트 상세 정보 조회
    async function showProjectDetails(projectId) {
      try {
        const response = await fetch(`/api/project/${projectId}`);
        if (!response.ok) throw new Error('프로젝트 정보를 불러올 수 없습니다');

        const project = await response.json();
        showModal(project);
      } catch (error) {
        console.error('Error:', error);
        alert(error.message);
      }
    }

    // 모달 표시
    function showModal(project) {
      document.getElementById('modalTitle').textContent = project.title;
      document.getElementById('modalStartDate').textContent = project.startDate;
      document.getElementById('modalPlace').textContent = project.place;
      document.getElementById('modalStatus').textContent = project.status;
      document.getElementById('projectModal').style.display = 'block';
    }

    // 모달 닫기
    function closeModal() {
      document.getElementsByClassName('closeBtn').style.display = 'none';
    }

    // 상태 옵션 생성
    function createStatusOptions(currentStatus) {
      const statusMap = {
        'IN_PROGRESS': '진행중',
        'DONE': '완료',
        'ON_HOLD': '보류',
        'TO_DO': '시작전'
      };

      let options = '';
      for (const [value, label] of Object.entries(statusMap)) {
        const selected = currentStatus === value ? 'selected' : '';
        options += `<option value="${value}" ${selected}>${label}</option>`;
      }
      return options;
    }

    // 프로젝트 항목 추가
    function addProjectToList(project) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
    <td>${project.startDate || '-'}</td>
    <td>
      <a href="#" class="project-name" data-id="${project.id}"
         style="color:#0056b3; text-decoration:underline;">
        ${project.title}
      </a>
    </td>
    <td>${project.place || '-'}</td>
    <td>
      <select class="project-status" data-id="${project.id}">
        ${createStatusOptions(project.status)}
      </select>
    </td>
  `;

      // 프로젝트 이름 클릭 이벤트
      tr.querySelector('.project-name').addEventListener('click', function(e) {
        e.preventDefault();
        showProjectDetails(project.id);
      });

      // 상태 변경 이벤트 (필요시 API 호출 추가)
      tr.querySelector('.project-status').addEventListener('change', function(e) {
        console.log(`프로젝트 ${project.id} 상태 변경: ${e.target.value}`);
        // TODO: 상태 변경 API 호출
      });

      document.getElementById('project-list').appendChild(tr);
    }

    // ESC 키로 모달 닫기
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });

    // 생성 버튼 클릭
    document.getElementById('create-project-form').addEventListener('click', function(e) {
      e.preventDefault();
      window.location.href = '/project/create';
    });

    // 수정 버튼 클릭
    window.editProject = function(id) {
      window.location.href = `/project/create?id=${id}`;
    };

    // 프로젝트 삭제
    window.deleteProject = function(id) {
      if (confirm('Are you sure you want to delete this project?')) {
        fetch(`/api/project/${id}`, {
          method: 'DELETE',
        })
                .then(response => {
                  if (!response.ok) throw new Error('Failed to delete project');
                  loadProjects();
                })
                .catch(error => {
                  console.error('Error:', error);
                  alert('Failed to delete project');
                });
      }
    };

    // 수정 모달 폼 제출
    document.getElementById('edit-project-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const newName = document.getElementById('edit-project-name').value;

      fetch(`/api/project/${currentProjectId}`, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ name: newName }),
      })
              .then(response => {
                if (!response.ok) throw new Error('Failed to update project');
                loadProjects();
                editModal.style.display = 'none';
              })
              .catch(error => {
                console.error('Error:', error);
                alert('Failed to update project');
              });
    });

    // 모달 닫기
    closeBtn.onclick = function() {
      editModal.style.display = 'none';
    };

    window.onclick = function(event) {
      if (event.target == editModal) {
        editModal.style.display = 'none';
      }
    };

    //프로젝트 리스트 조회
    function loadProjects() {
      fetch('/api/project')
              .then(response => response.json())
              .then(data => {
                const projects = data.content;
                console.log(projects);
                if (!Array.isArray(projects)) {
                  throw new Error('프로젝트 목록이 배열이 아닙니다.');
                }
                const projectList = document.getElementById('project-list');
                projectList.innerHTML = '';
                projects.forEach(addProjectToList);
              })
              .catch(error => {
                console.error('Error loading projects:', error);
                alert('프로젝트 목록을 불러오지 못했습니다.');
              });
    }
    // 초기 프로젝트 목록 로드
    loadProjects();
  });
</script>
</body>
</html>
