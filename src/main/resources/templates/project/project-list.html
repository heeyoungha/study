<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Project</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
  <div class="container">
    <!-- 공통 네비게이션 불러오기 -->
    <div th:replace="~{fragment/nav :: navigation}"></div>

    <h1>🏄🏻 프로젝트 관리</h1>
  
      <!-- 테이블 컨테이너 -->
      <div id="table-container" style="display: none;">
        <table>
          <thead>
            <tr>
              <th>시작일자</th>
              <th>프로젝트</th>
              <th>장소</th>
              <th>상태</th>
            </tr>
          </thead>
          <tbody id="project-list">
            <!-- JS로 동적으로 행을 추가 -->
          </tbody>
        </table>
      </div>

      <!-- 검색기능 -->
      <div class="search-container" style="display: none;">
        <form th:action="@{/project}" method="get" class="search-form">
          <input type="text" name="searchKeyword" placeholder="검색어를 입력하세요" th:value="${searchKeyword}">
          <button type="submit">검색</button>
        </form>
      </div>

      <!-- 페이징 -->
      <div th:if="${!projectList.isEmpty()}" class="pagination-container" style="display: none;">
        <ul class="pagination"
            th:with="
                          pageNumber = ${projectList.pageable.pageNumber},
                          pageSize = ${projectList.pageable.pageSize},
                          totalPages = ${projectList.totalPages},
                          startPage = ${T(java.lang.Math).floor(pageNumber / pageSize) * pageSize + 1},
                          tempEndPage = ${startPage + pageSize - 1},
                          endPage = (${tempEndPage < totalPages ? tempEndPage : totalPages})">

          <li th:classappend="${projectList.first} ? 'disabled'" class="page-item">
            <a class="page-link" th:href="${projectList.first} ? '#' : @{/(page=${pageNumber - 1})}">
              <span aria-hidden="true"><</span>
            </a>
          </li>

          <li th:each="page: ${#numbers.sequence(startPage, endPage)}" th:classappend="${page == pageNumber + 1} ? 'active'" class="page-item">
            <a th:text="${page}" class="page-link" th:href="@{/(page=${page - 1})}"></a>
          </li>

          <li th:classappend="${projectList.last} ? 'disabled'" class="page-item">
            <a class="page-link" th:href="${projectList.last} ? '#' : @{/(page=${pageNumber + 1})}" aria-label="Next">
              <span aria-hidden="true">&gt;</span>
            </a>
          </li>
        </ul>
      </div>
  </div>

  <!-- Show Project Detail -->
  <div id="projectModal" class="modal" style="display:none; position:fixed; left:0; top:0; width:100vw; height:100vh; background:rgba(0,0,0,0.3); z-index:1000;">
    <div class="modal-content" style="background:#fff; margin:10vh auto; padding:24px; border-radius:8px; max-width:400px; position:relative;">
      <span class="close" style="position:absolute; right:16px; top:8px; cursor:pointer; font-size:24px;">&times;</span>
      <h2 id="modalTitle"></h2>
      <p><strong>시작일자:</strong> <span id="modalStartDate"></span></p>
      <p><strong>장소:</strong> <span id="modalPlace"></span></p>
      <p><strong>상태:</strong> <span id="modalStatus"></span></p>
    </div>
  </div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const projectList = document.getElementById('project-list');
    const editModal = document.getElementById('editModal');
    const closeBtn = document.querySelector('.close');
    const createProjectBtn = document.getElementById('create-project-btn');
    let currentProjectId = null;

    // 프로젝트 상세 정보 조회
    async function showProjectDetails(projectId) {
      try {
        const response = await fetch(`/api/project/${projectId}`);
        if (!response.ok) throw new Error('프로젝트 정보를 불러올 수 없습니다');

        const project = await response.json();
        showModal(project);
      } catch (error) {
        console.error('Error:', error);
        alert(error.message);
      }
    }

    // 모달 표시
    function showModal(project) {
      document.getElementById('modalTitle').textContent = project.title;
      document.getElementById('modalStartDate').textContent = project.startDate;
      document.getElementById('modalPlace').textContent = project.place;
      document.getElementById('modalStatus').textContent = project.status;
      document.getElementById('projectModal').style.display = 'block';
    }

    // 모달 닫기
    function closeModal() {
      document.getElementsByClassName('closeBtn').style.display = 'none';
    }

    // 상태 옵션 생성
    function createStatusOptions(currentStatus) {
      const statusMap = {
        'IN_PROGRESS': '진행중',
        'DONE': '완료',
        'ON_HOLD': '보류',
        'TO_DO': '시작전'
      };

      let options = '';
      for (const [value, label] of Object.entries(statusMap)) {
        const selected = currentStatus === value ? 'selected' : '';
        options += `<option value="${value}" ${selected}>${label}</option>`;
      }
      return options;
    }

    // 프로젝트 항목 추가
    function addProjectToList(project) {
      const tr = document.createElement('tr');
      const statusMap = {
        'IN_PROGRESS': { label: '진행중', class: 'status-in_progress' },
        'DONE': { label: '완료', class: 'status-done' },
        'ON_HOLD': { label: '보류', class: 'status-on_hold' },
        'TO_DO': { label: '시작전', class: 'status-to_do' }
      };
      const status = statusMap[project.status] || { label: project.status, class: '' };

      tr.innerHTML = `
        <td>${project.startDate || '-'}</td>
        <td>
          <a href="#" class="project-name" data-id="${project.id}">
            ${project.title}
          </a>
        </td>
        <td>${project.place || '-'}</td>
        <td>
          <span class="status-tag ${status.class}" data-id="${project.id}" data-status="${project.status}">
            ${status.label}
          </span>
        </td>
      `;

      // 프로젝트 이름 클릭 이벤트
      tr.querySelector('.project-name').addEventListener('click', function(e) {
        e.preventDefault();
        showProjectDetails(project.id);
      });

      // 상태 태그 클릭 이벤트 (추후 상태 변경 UI 연결)
      tr.querySelector('.status-tag').addEventListener('click', function(e) {
        // TODO: 상태 변경 UI 오픈
        alert('상태 변경 기능은 추후 지원 예정입니다.');
      });

      document.getElementById('project-list').appendChild(tr);
    }

    // 빈 상태 메시지 표시
    function showEmptyMessage() {
      const tbody = document.getElementById('project-list');
      tbody.innerHTML = `
        <tr>
          <td colspan="4">
            <div class="empty">
              <h3>아직 프로젝트가 없습니다.</h3>
              <p>첫 번째 프로젝트를 생성해보세요!</p>
            </div>
          </td>
        </tr>
      `;
    }

    // ESC 키로 모달 닫기
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });

    // 프로젝트 삭제
    window.deleteProject = function(id) {
      if (confirm('Are you sure you want to delete this project?')) {
        fetch(`/api/project/${id}`, {
          method: 'DELETE'
        })
        .then(response => {
          if (!response.ok) throw new Error('삭제 실패');
          alert('프로젝트가 삭제되었습니다.');
          location.reload();
        })
        .catch(error => {
          console.error('Error:', error);
          alert('삭제 중 오류가 발생했습니다.');
        });
      }
    };

    //프로젝트 리스트 조회
    function loadProjects() {
      fetch('/api/project')
        .then(response => response.json())
        .then(response => {
          const tableContainer = document.getElementById('table-container');
          const searchContainer = document.querySelector('.search-container');
          const paginationContainer = document.querySelector('.pagination-container');
          
          // Spring Boot 페이징 응답 구조에 맞게 수정
          const projects = response.content || response;
          const isEmpty = response.empty !== undefined ? response.empty : (!projects || projects.length === 0);
          
          // actions 버튼 처리
          let actions = document.querySelector('.actions');
          if (!isEmpty && projects && projects.length > 0) {
            // 데이터가 있으면 테이블과 검색, 페이징 표시
            tableContainer.style.display = 'block';
            searchContainer.style.display = 'block';
            if (paginationContainer) paginationContainer.style.display = 'block';
            
            // actions 버튼이 없으면 동적으로 추가
            if (!actions) {
              actions = document.createElement('div');
              actions.className = 'actions';
              actions.innerHTML = '<a href="/project/create">새 프로젝트 생성</a>';
              tableContainer.parentNode.insertBefore(actions, tableContainer);
            } else {
              actions.style.display = 'block';
            }
            
            const tbody = document.getElementById('project-list');
            tbody.innerHTML = '';
            projects.forEach(project => {
              addProjectToList(project);
            });
          } else {
            // 데이터가 없으면 테이블과 검색, 페이징 숨기고 빈 상태 메시지 표시
            tableContainer.style.display = 'none';
            searchContainer.style.display = 'none';
            if (paginationContainer) paginationContainer.style.display = 'none';
            if (actions) actions.style.display = 'none';
            
            // 빈 상태 메시지를 컨테이너에 직접 추가
            const container = document.querySelector('.container');
            const existingEmpty = container.querySelector('.empty-message');
            if (existingEmpty) existingEmpty.remove();
            
            const emptyMessage = document.createElement('div');
            emptyMessage.className = 'empty-message';
            emptyMessage.innerHTML = `
              <div class="empty">
                <h3>아직 프로젝트가 없습니다.</h3>
                <p>첫 번째 프로젝트를 생성해보세요!</p>
                <div class="nav-links">
                  <a href="/project/create">🏄🏻 새 프로젝트 생성</a>
                </div>
              </div>
            `;
            container.appendChild(emptyMessage);
          }
        })
        .catch(error => {
          console.error('Error loading projects:', error);
          // 오류 시에도 빈 상태 메시지 표시
          const tableContainer = document.getElementById('table-container');
          const searchContainer = document.querySelector('.search-container');
          const paginationContainer = document.querySelector('.pagination-container');
          tableContainer.style.display = 'none';
          searchContainer.style.display = 'none';
          if (paginationContainer) paginationContainer.style.display = 'none';
          if (actions) actions.style.display = 'none';
          
          const container = document.querySelector('.container');
          const existingEmpty = container.querySelector('.empty-message');
          if (existingEmpty) existingEmpty.remove();
          
          const emptyMessage = document.createElement('div');
          emptyMessage.className = 'empty-message';
          emptyMessage.innerHTML = `
            <div class="empty">
              <h3>프로젝트 목록을 불러올 수 없습니다.</h3>
              <p>잠시 후 다시 시도해주세요.</p>
              <div class="nav-links">
                <a href="/project/create">🏄🏻 새 프로젝트 생성</a>
              </div>
            </div>
          `;
          container.appendChild(emptyMessage);
        });
    }
    // 초기 프로젝트 목록 로드
    loadProjects();
  });
</script>
</body>
</html>
